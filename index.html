<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多益核心單字閃卡 (TOEIC Flashcards)</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --card-back-bg: #fffdfa;
      --text-main: #2d2926;
      --text-muted: #79716b;
      --text-sub: #a8a29e;
      --border-color: #e7e2d9;
      --border-dashed: #dcd5c9;
      --tab-bg: #ece7de;
      --chip-bg: #f3efe9;
      --accent: #b85d38;
      --accent-hover: #9e4a29;
      --accent-soft: #fbf3ee;
      --accent-border: rgba(184, 93, 56, 0.25);
      --green: #4f7942;
      --green-soft: #f0f6ee;
      --green-border: rgba(79, 121, 66, 0.3);
      --amber: #c87d2a;
      --amber-soft: #fdf6ec;
      --amber-border: rgba(200, 125, 42, 0.3);
      --btn-hover: #f0ebe2;
      --example-bg: #fbf9f5;
      --shadow-sm: 0 2px 8px rgba(45, 41, 38, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(45, 41, 38, 0.07), 0 8px 10px -6px rgba(45, 41, 38, 0.04);
      --shadow-lg: 0 20px 30px -10px rgba(45, 41, 38, 0.12);
      --modal-overlay: rgba(30, 26, 23, 0.5);
      --radius: 14px;
    }

    [data-theme="dark"] {
      --bg-color: #1a1816;
      --card-bg: #262320;
      --card-back-bg: #2b2723;
      --text-main: #f3eee8;
      --text-muted: #aba39a;
      --text-sub: #78716a;
      --border-color: #3d3833;
      --border-dashed: #4a443e;
      --tab-bg: #2c2824;
      --chip-bg: #35302b;
      --accent: #d4764e;
      --accent-hover: #e08a63;
      --accent-soft: rgba(212, 118, 78, 0.18);
      --accent-border: rgba(212, 118, 78, 0.35);
      --green: #689f38;
      --green-soft: rgba(104, 159, 56, 0.18);
      --green-border: rgba(104, 159, 56, 0.35);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.18);
      --amber-border: rgba(217, 119, 6, 0.35);
      --btn-hover: #332e29;
      --example-bg: #221f1c;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
      --modal-overlay: rgba(0, 0, 0, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .title-group p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover);
      transform: scale(1.05);
    }

    .status-badge {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--accent-border);
      white-space: nowrap;
    }

    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      height: 6px;
      width: 100%;
      background: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px
