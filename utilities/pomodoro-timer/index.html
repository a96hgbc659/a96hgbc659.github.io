<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">
    <title>Pomodoro</title>
    <style>
        :root {
            --bg-color: #f9f8f6;
            --text-color: #5c544d;
            --accent-color: #8f857d;
            --btn-hover: #7a7068;
            --modal-bg: rgba(249, 248, 246, 0.96);
        }
        
        [data-theme="dark"] {
            --bg-color: #2c2a29;
            --text-color: #d1cbc5;
            --accent-color: #a89f96;
            --btn-hover: #b8b1a8;
            --modal-bg: rgba(44, 42, 41, 0.96);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1.2rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-color);
            padding: 0;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-color);
        }

        .container {
            text-align: center;
            padding: 1.5rem;
            max-width: 90%;
        }

        .phase-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.2rem;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            opacity: 0.5;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            opacity: 1;
            border-color: var(--accent-color);
        }

        #cycleTracker {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.65;
            margin-bottom: 0.5rem;
        }

        #timer {
            font-size: 5rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin: 0 0 2rem 0;
            letter-spacing: -0.02em;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }

        button.action-btn {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        button.action-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        button.action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #ccc;
        }

        #startBtn {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        #startBtn:hover {
            background-color: var(--btn-hover);
        }
        
        #settingsModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .modal-content {
            background-color: var(--modal-bg);
            padding: 1.8rem;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            width: 300px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 1.1rem;
            font-weight: 500;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .setting-group {
            margin-bottom: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .setting-group input[type="number"] {
            width: 60px;
            padding: 0.3rem;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            border-radius: 4px;
            text-align: center;
            font-size: 0.95rem;
        }

        .setting-stack {
            margin-bottom: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.85rem;
            text-align: left;
        }

        .setting-stack input[type="text"] {
            padding: 0.4rem;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 0.8rem;
        }

        #pushStatus {
            font-size: 0.75rem;
            opacity: 0.75;
            margin-top: 0.3rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="top-controls">
        <button class="icon-btn" id="muteToggle" title="Toggle Mute">🔊</button>
        <button class="icon-btn" id="themeToggle" title="Toggle Dark Mode">☾</button>
        <button class="icon-btn" id="settingsToggle" title="Settings">⚙</button>
    </div>

    <div class="container">
        <div class="phase-tabs">
            <button class="tab-btn active" data-phase="work">Work</button>
            <button class="tab-btn" data-phase="shortBreak">Short Break</button>
            <button class="tab-btn" data-phase="longBreak">Long Break</button>
        </div>
        <div id="cycleTracker">Session 1 / 4</div>
        <div id="timer">25:00</div>
        <div class="controls">
            <button class="action-btn" id="startBtn">Start</button>
            <button class="action-btn" id="pauseBtn" disabled>Pause</button>
            <button class="action-btn" id="resetBtn">Reset</button>
            <button class="action-btn" id="nextBtn" title="Skip to Next Phase">Next ⏭</button>
        </div>
    </div>
    
    <div id="settingsModal">
        <div class="modal-content">
            <h2>Timer Durations</h2>
            <div class="setting-group">
                <label for="workInput">Work (min):</label>
                <input type="number" id="workInput" min="1" max="120" value="25">
            </div>
            <div class="setting-group">
                <label for="shortBreakInput">Short Break (min):</label>
                <input type="number" id="shortBreakInput" min="1" max="60" value="5">
            </div>
            <div class="setting-group">
                <label for="longBreakInput">Long Break (min):</label>
                <input type="number" id="longBreakInput" min="1" max="90" value="15">
            </div>
            <div class="setting-group">
                <label for="intervalInput">Long Break Interval:</label>
                <input type="number" id="intervalInput" min="1" max="12" value="4">
            </div>

            <h2>Web Push Config (iOS PWA)</h2>
            <div class="setting-stack">
                <label for="workerUrlInput">Backend Worker URL:</label>
                <input type="text" id="workerUrlInput" placeholder="https://your-worker.workers.dev">
            </div>
            <div class="setting-stack">
                <label for="vapidKeyInput">VAPID Public Key:</label>
                <input type="text" id="vapidKeyInput" placeholder="BEl62i...">
            </div>
            <button class="action-btn" id="enablePushBtn" style="width: 100%; font-size: 0.85rem; padding: 0.5rem;">Enable Lock-Screen Push</button>
            <div id="pushStatus">Not subscribed</div>

            <div class="modal-actions">
                <button class="action-btn" id="cancelSettings">Cancel</button>
                <button class="action-btn" id="saveSettings" style="background-color: var(--accent-color); color: var(--bg-color);">Save</button>
            </div>
        </div>
    </div>

    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let workDuration = 25 * 60;
        let shortBreakDuration = 5 * 60;
        let longBreakDuration = 15 * 60;
        let longBreakInterval = 4;

        let currentPhase = 'work';
        let currentSession = 1;
        let duration = workDuration; 
        let remaining = duration;
        let targetEndTime = null;
        let timerInterval = null;
        let isRunning = false;
        let isMuted = localStorage.getItem('muted') === 'true';

        let workerUrl = localStorage.getItem('workerUrl') || '';
        let vapidPublicKey = localStorage.getItem('vapidPublicKey') || '';
        let pushSubscription = null;

        const timerDisplay = document.getElementById('timer');
        const cycleTracker = document.getElementById('cycleTracker');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const nextBtn = document.getElementById('nextBtn');
        const alarm = document.getElementById('alarmSound');
        
        const muteToggle = document.getElementById('muteToggle');
        const themeToggle = document.getElementById('themeToggle');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsModal = document.getElementById('settingsModal');
        const cancelSettings = document.getElementById('cancelSettings');
        const saveSettings = document.getElementById('saveSettings');
        
        const workInput = document.getElementById('workInput');
        const shortBreakInput = document.getElementById('shortBreakInput');
        const longBreakInput = document.getElementById('longBreakInput');
        const intervalInput = document.getElementById('intervalInput');
        const workerUrlInput = document.getElementById('workerUrlInput');
        const vapidKeyInput = document.getElementById('vapidKeyInput');
        const enablePushBtn = document.getElementById('enablePushBtn');
        const pushStatus = document.getElementById('pushStatus');

        const phaseLabels = {
            work: 'Work',
            shortBreak: 'Short Break',
            longBreak: 'Long Break'
        };

        // Initialize Service Worker & Existing Push Subscription
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(async (reg) => {
                pushSubscription = await reg.pushManager.getSubscription();
                if (pushSubscription) {
                    pushStatus.textContent = "Push Active ✓";
                }
            }).catch(err => console.log('SW registration failed:', err));
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        enablePushBtn.addEventListener('click', async () => {
            const key = vapidKeyInput.value.trim();
            if (!key) {
                pushStatus.textContent = "Please enter a VAPID Public Key first.";
                return;
            }
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                pushStatus.textContent = "Add to Home Screen first to enable iOS Web Push.";
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    pushStatus.textContent = "Notification permission denied.";
                    return;
                }
                const reg = await navigator.serviceWorker.ready;
                pushSubscription = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(key)
                });
                pushStatus.textContent = "Push Active ✓";
            } catch (e) {
                pushStatus.textContent = "Subscription error: " + e.message;
            }
        });

        async function scheduleBackendPush(seconds) {
            if (!workerUrl || !pushSubscription) return;
            let msg = "Time for a short break!";
            if (currentPhase === 'work' && currentSession >= longBreakInterval) {
                msg = "Great job! Time for a long break.";
            } else if (currentPhase !== 'work') {
                msg = "Break is over! Back to work.";
            }
            try {
                await fetch(`${workerUrl.replace(/\/$/, '')}/schedule`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subscription: pushSubscription,
                        delaySeconds: seconds,
                        title: `Pomodoro (${phaseLabels[currentPhase]})`,
                        body: msg
                    })
                });
            } catch (e) {
                console.log("Failed to schedule push:", e);
            }
        }

        async function cancelBackendPush() {
            if (!workerUrl || !pushSubscription) return;
            try {
                await fetch(`${workerUrl.replace(/\/$/, '')}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ endpoint: pushSubscription.endpoint })
                });
            } catch (e) {
                console.log("Failed to cancel push:", e);
            }
        }

        function updateMuteUI() {
            muteToggle.textContent = isMuted ? '🔇' : '🔊';
            alarm.muted = isMuted;
        }
        updateMuteUI();

        muteToggle.addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('muted', isMuted);
            updateMuteUI();
        });

        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '☾';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀';
            }
        });

        settingsToggle.addEventListener('click', () => {
            workInput.value = workDuration / 60;
            shortBreakInput.value = shortBreakDuration / 60;
            longBreakInput.value = longBreakDuration / 60;
            intervalInput.value = longBreakInterval;
            workerUrlInput.value = workerUrl;
            vapidKeyInput.value = vapidPublicKey;
            settingsModal.style.display = 'flex';
        });

        cancelSettings.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        saveSettings.addEventListener('click', () => {
            workDuration = Math.max(1, parseInt(workInput.value) || 25) * 60;
            shortBreakDuration = Math.max(1, parseInt(shortBreakInput.value) || 5) * 60;
            longBreakDuration = Math.max(1, parseInt(longBreakInput.value) || 15) * 60;
            longBreakInterval = Math.max(1, parseInt(intervalInput.value) || 4);
            
            workerUrl = workerUrlInput.value.trim();
            vapidPublicKey = vapidKeyInput.value.trim();
            localStorage.setItem('workerUrl', workerUrl);
            localStorage.setItem('vapidPublicKey', vapidPublicKey);

            if (currentSession > longBreakInterval) {
                currentSession = 1;
            }
            
            setPhase(currentPhase, false);
            settingsModal.style.display = 'none';
        });

        function getPhaseDuration(phase) {
            if (phase === 'work') return workDuration;
            if (phase === 'shortBreak') return shortBreakDuration;
            return longBreakDuration;
        }

        function setPhase(phase, resetTimerState = true) {
            if (resetTimerState) pause();
            currentPhase = phase;
            duration = getPhaseDuration(phase);
            if (!isRunning || resetTimerState) {
                remaining = duration;
            }
            tabBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.phase === phase);
            });
            cycleTracker.textContent = `Session ${currentSession} / ${longBreakInterval}`;
            updateDisplay(remaining);
        }

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setPhase(btn.dataset.phase, true);
            });
        });

        function advanceToNextPhase(playSound = false) {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            pauseBtn.disabled = true;

            if (playSound && !isMuted && document.visibilityState === 'visible') {
                alarm.currentTime = 0;
                alarm.play().catch(() => {});
            }

            if (currentPhase === 'work') {
                if (currentSession >= longBreakInterval) {
                    setPhase('longBreak', false);
                } else {
                    setPhase('shortBreak', false);
                }
            } else {
                if (currentPhase === 'longBreak') {
                    currentSession = 1;
                } else {
                    currentSession++;
                }
                setPhase('work', false);
            }
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
            document.title = `${m}:${s} - ${phaseLabels[currentPhase]}`;
        }

        function tick() {
            if (!isRunning) return;
            const now = Date.now();
            remaining = Math.round((targetEndTime - now) / 1000);

            if (remaining <= 0) {
                remaining = 0;
                updateDisplay(remaining);
                advanceToNextPhase(true);
            } else {
                updateDisplay(remaining);
            }
        }

        function start() {
            if (isRunning) return;
            
            alarm.play().then(() => {
                alarm.pause();
                alarm.currentTime = 0;
            }).catch(() => {});

            isRunning = true;
            targetEndTime = Date.now() + (remaining * 1000);
            
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            scheduleBackendPush(remaining);
            timerInterval = setInterval(tick, 500); 
        }

        function pause() {
            if (isRunning) {
                cancelBackendPush();
            }
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        function reset() {
            pause();
            remaining = duration;
            updateDisplay(remaining);
        }

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);
        nextBtn.addEventListener('click', () => {
            cancelBackendPush();
            advanceToNextPhase(false);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) {
                tick(); 
            }
        });
    </script>
</body>
</html>
