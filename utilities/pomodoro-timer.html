<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Pomodoro</title>
    <style>
        :root {
            --bg-color: #f9f8f6;
            --text-color: #5c544d;
            --accent-color: #8f857d;
            --btn-hover: #7a7068;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        #mode {
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        #timer {
            font-size: 5rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin: 0 0 2rem 0;
            letter-spacing: -0.02em;
        }
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }
        button:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #ccc;
        }
        #startBtn {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }
        #startBtn:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="mode">Work</div>
        <div id="timer">25:00</div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>
    
    <!-- A gentle chime for the alarm -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let duration = 25 * 60; 
        let remaining = duration;
        let targetEndTime = null;
        let timerInterval = null;
        let isRunning = false;
        let isWorkMode = true;

        const timerDisplay = document.getElementById('timer');
        const modeDisplay = document.getElementById('mode');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const alarm = document.getElementById('alarmSound');

        // Request notification permission for background alerts on iOS
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
            document.title = `${m}:${s} - Pomodoro`;
        }

        function playAlarmAndNotify() {
            alarm.play().catch(e => console.log("Audio play prevented by browser:", e));
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Pomodoro Timer", {
                    body: isWorkMode ? "Break time!" : "Back to work!",
                    requireInteraction: true
                });
            }
        }

        function completeTimer() {
            pause();
            playAlarmAndNotify();
            isWorkMode = !isWorkMode;
            duration = (isWorkMode ? 25 : 5) * 60;
            remaining = duration;
            modeDisplay.textContent = isWorkMode ? "Work" : "Break";
            updateDisplay(remaining);
        }

        function tick() {
            if (!isRunning) return;
            
            // Calculate remaining time using absolute timestamps to survive background throttling
            const now = Date.now();
            remaining = Math.round((targetEndTime - now) / 1000);

            if (remaining <= 0) {
                remaining = 0;
                updateDisplay(remaining);
                completeTimer();
            } else {
                updateDisplay(remaining);
            }
        }

        function start() {
            if (isRunning) return;
            requestNotificationPermission();
            
            // iOS audio unlocking: must play/pause on direct user interaction
            alarm.play().then(() => alarm.pause()).catch(() => {});

            isRunning = true;
            targetEndTime = Date.now() + (remaining * 1000);
            
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            // Run interval frequently to catch up smoothly after backgrounding
            timerInterval = setInterval(tick, 250); 
        }

        function pause() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }

        function reset() {
            pause();
            remaining = duration;
            updateDisplay(remaining);
        }

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);

        // Sync timer immediately when returning from background
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) {
                tick(); 
            }
        });
    </script>
</body>
</html>
