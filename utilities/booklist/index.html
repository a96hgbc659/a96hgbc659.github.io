<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklist | ShihCheng Huang</title>
    <style>
        :root {
            /* Muji Light Theme */
            --muji-bg: #faf9f5;
            --muji-surface: #ffffff;
            --muji-text: #333230;
            --muji-text-light: #807e7a;
            --muji-border: #e6e4df;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Muji Dark Theme */
                --muji-bg: #21201f;
                --muji-surface: #2a2928;
                --muji-text: #dedcd7;
                --muji-text-light: #969490;
                --muji-border: #3d3c3a;
            }
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--muji-bg);
            color: var(--muji-text);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            letter-spacing: 0.03em;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            width: 85%;
            margin: 5rem 0;
        }

        header {
            margin-bottom: 4rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            margin: 0;
            letter-spacing: 0.05em;
        }

        .back-link {
            color: var(--muji-text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 300;
            transition: color 0.2s ease;
            font-family: monospace;
            letter-spacing: 0;
        }

        .back-link:hover {
            color: var(--muji-text);
        }

        section {
            margin-bottom: 4rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--muji-text);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--muji-border);
            padding-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        .book-card {
            background-color: var(--muji-surface);
            border: 1px solid var(--muji-border);
            border-radius: 2px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0 0 0.3rem 0;
            line-height: 1.4;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--muji-text-light);
            margin: 0 0 1.2rem 0;
            font-weight: 300;
        }

        .book-notes {
            font-size: 0.9rem;
            color: var(--muji-text);
            margin: 0 0 1.5rem 0;
            flex-grow: 1;
            font-weight: 300;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .tag {
            border: 1px solid var(--muji-border);
            color: var(--muji-text-light);
            padding: 0.2rem 0.6rem;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Booklist</h1>

        </header>

                        <div class="tags">
                            <span class="tag">Genre</span>

                        </div>
                    </div>

                </div>
            </section>
