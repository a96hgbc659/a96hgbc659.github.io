<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilities & Links | ShihCheng Huang</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --bg-color: #F7F6F2;
            --text-main: #33312E;
            --text-muted: #76716A;
            --accent-color: #7F0019;
            --border-color: #DCD7CE;
            --hover-bg: #EFECE6;
        }

        [data-theme="dark"] {
            --bg-color: #1C1B1A;
            --text-main: #E6E2DC;
            --text-muted: #9E9890;
            --accent-color: #C84B5F;
            --border-color: #3D3A36;
            --hover-bg: #262523;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 4rem 0;
        }

        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 0.02em;
            color: var(--text-main);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
            margin-bottom: 1.5rem;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .theme-toggle {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: inherit;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .muji-link-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid var(--border-color);
        }

        .muji-link-list li {
            border-bottom: 1px solid var(--border-color);
        }

        .muji-link-list a {
            display: flex;
            align-items: center;
            padding: 1.2rem 1rem;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.2s ease;
            gap: 1rem;
        }

        .muji-link-list a:hover {
            background-color: var(--hover-bg);
            color: var(--accent-color);
            padding-left: 1.5rem; /* 懸停時的微小位移效果 */
        }

        .link-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .link-text {
            flex-grow: 1;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .link-arrow {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .muji-link-list a:hover .link-arrow {
            transform: translateX(4px);
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Back to Profile</a>
        
        <header>
            <h1>Utilities & Links</h1>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
                DARK
            </button>
        </header>

        <main>
            <ul class="muji-link-list">
                <li>
                    <a href="https://pomofocus.io/" target="_blank" rel="noopener noreferrer">
                        <span class="link-icon">⏱️</span>
                        <span class="link-text">Pomodoro Timer</span>
                        <span class="link-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="../utilities/flashcards_eng/index.html">
                        <span class="link-icon">📇</span>
                        <span class="link-text">Flashcards_eng</span>
                        <span class="link-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="../utilities/flashcards_jp/index.html">
                        <span class="link-icon">📇</span>
                        <span class="link-text">Flashcards_jp</span>
                        <span class="link-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="../utilities/booklist/index.html">
                        <span class="link-icon">📚</span>
                        <span class="link-text">Booklist</span>
                        <span class="link-arrow">→</span>
                    </a>
                </li>
                <li>
                    <a href="../trips/employee_travel_2026/index.html">
                        <span class="link-icon">✈️</span>
                        <span class="link-text">employee_travel_2026</span>
                        <span class="link-arrow">→</span>
                    </a>
                </li>
            </ul>
        </main>
    </div>

    <script>
        (function() {
            const toggleBtn = document.getElementById('theme-toggle');
            const root = document.documentElement;

            function updateButtonLabel(theme) {
                toggleBtn.textContent = theme === 'dark' ? 'LIGHT' : 'DARK';
            }

            updateButtonLabel(root.getAttribute('data-theme'));

            toggleBtn.addEventListener('click', () => {
                const currentTheme = root.getAttribute('data-theme');
                const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', nextTheme);
                localStorage.setItem('theme', nextTheme);
                updateButtonLabel(nextTheme);
            });
        })();
    </script>
</body>
</html>
